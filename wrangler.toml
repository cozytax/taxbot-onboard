name = "taxbot-onboard"
main = "worker.js"
compatibility_date = "2026-01-01"

[vars]
MAIL_FROM = "onboard@cozytax.co.kr"         # Resend 에서 도메인 인증한 주소
MAIL_TO = "cozytax@naver.com"               # 결과 수신 (쉼표로 여러 명)
ALLOWED_ORIGIN = "https://cozytax.github.io"
GEMINI_MODEL = "gemini-2.5-flash"
CMS_PAYMM = "12"
DEPOSIT_DATE = "20"

# secrets (wrangler secret put) — 저장소에 절대 커밋하지 말 것:
#   TAXBOT_BASE      기존 taxbot Worker 주소 (무인증 GET API라 공개 금지)
#   GEMINI_API_KEY
#   STAFF_KEY        직원 접근 키 (페이지 주소 뒤 ?k= 값)
#   RESEND_API_KEY   resend.com API 키
